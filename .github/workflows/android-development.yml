name: Android development validation

on:
  pull_request:
    paths:
      - ".github/workflows/android-development.yml"
      - "android/**"
      - "app.config.ts"
      - "assets/**"
      - "content/**"
      - "modules/**"
      - "plugins/**"
      - "lib/**"
      - "components/**"
      - "package.json"
      - "bun.lock"
      - "scripts/verify-android-prebuild.py"
  push:
    branches:
      - main
      - "feat/youtube-player-android-*"
  workflow_dispatch:
    inputs:
      retain_qa_apks:
        description: "Retain unsigned-for-release, ephemeral debug APKs for a 1-day device QA session"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  android-compile:
    name: Android FOSS/Full source compile (no distribution)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_GIT_STATUS: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
      - name: Set up Java for Android Gradle Plugin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android command line SDK without deprecated packages
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android 36 platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Set up locked Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Restore source dependencies without install scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Bundle inherited WebView content script
        run: bun run bundle:es
      - name: Generate Android source cleanly
        run: bunx expo prebuild --platform android --clean --no-install
      - name: Verify Android product identity and variant isolation
        run: python3 -B scripts/verify-android-prebuild.py
      - name: Make Gradle executable
        run: chmod +x android/gradlew
      - name: Compile both Android development flavors
        working-directory: android
        run: |
          ./gradlew :app:assembleFossDebug :app:assembleFullDebug --no-daemon --stacktrace --max-workers=2
      - name: Verify device ABI output files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          outputs = list(Path('android/app/build/outputs/apk').rglob('*.apk'))
          assert any('foss' in str(p).lower() for p in outputs), outputs
          assert any('full' in str(p).lower() for p in outputs), outputs
          print(f"Verified {len(outputs)} ephemeral Android debug APKs.")
          PY
      - name: Verify bounded QA APKs and record checksums
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.retain_qa_apks == true }}
        run: |
          mkdir -p qa-evidence
          printf 'source_sha=%s\nrun_id=%s\nephemeral_debug_only=true\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" > qa-evidence/build.txt
          find android/app/build/outputs/apk -type f -name '*.apk' -print0 | sort -z | \
            xargs -0 sha256sum >> qa-evidence/build.txt
          while IFS= read -r -d '' apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          done < <(find android/app/build/outputs/apk -type f -name '*.apk' -print0)
      - name: Retain bounded QA APKs for 1 day
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.retain_qa_apks == true }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-debug-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            android/app/build/outputs/apk/foss/debug/*.apk
            android/app/build/outputs/apk/full/debug/*.apk
            qa-evidence/build.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

# Pull requests and pushes NEVER upload APKs. Manual owner-triggered opt-in
# retains only ephemeral debug QA APKs for 1 day with checksums; no release
# signing identity, release publication, GoreeCloud Drive delivery or deployment.
