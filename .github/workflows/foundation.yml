name: Fork-to-Native foundation
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source identity and provenance
        run: python3 -m unittest discover -s tests/goreecloud -p 'test_*.py' -v
