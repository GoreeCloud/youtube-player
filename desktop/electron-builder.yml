appId: com.goreecloud.youtubeplayer
productName: GoreeCloud YouTube Player
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!changelogs/*'
asarUnpack:
  - resources/**
protocols:
  - name: GoreeCloud YouTube Player
    schemes:
      - goreecloud-youtube-player
win:
  executableName: goreecloud-youtube-player
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# Windows publisher identity is intentionally not inherited; configure after signing approval.
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  executableName: goreecloud-youtube-player
  executableArgs:
    - --ozone-platform=x11
  target:
    - AppImage
    - snap
  maintainer: GoreeCloud
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
snap:
  artifactName: goreecloud-youtube-player_${version}_${arch}.${ext}
npmRebuild: false
# No upstream release publisher; GoreeCloud release channel not configured.
